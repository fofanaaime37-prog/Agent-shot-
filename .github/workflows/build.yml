name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Compiler le jeu avec pubs
        run: |
          flutter create --project-name agent_shot_b --org com.monnom appb
          cp lib/main.dart appb/lib/main.dart
          sed -i 's/const useAds = false;/const useAds = true;/' appb/lib/main.dart
          cd appb
          flutter pub add google_mobile_ads
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' $M
          sed -i '0,/<activity/s//<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>\n        <activity/' $M
          flutter build apk --release --no-shrink
          grep -A 3 "google_mobile_ads" pubspec.lock | head -5
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test sur telephone virtuel
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install -r appb/build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.monnom.agent_shot_b -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d > full.txt
      - name: Afficher le crash
        if: always()
        run: |
          grep -n -m1 -A 40 "FATAL EXCEPTION" full.txt || echo "PAS DE PLANTAGE DETECTE"
          grep -i "agent_shot_b" full.txt | tail -20 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-logs
          path: full.txt
      - uses: actions/upload-artifact@v4
        with:
          name: variante-b-apk
          path: appb/build/app/outputs/flutter-apk/app-release.apk
