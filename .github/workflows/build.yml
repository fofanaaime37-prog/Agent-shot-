name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Preparer test et prod
        run: |
          for V in test prod; do
            if [ $V = test ]; then
              ORG=com.fofana.test
              APPID=ca-app-pub-3940256099942544~3347511713
              BAN=ca-app-pub-3940256099942544/6300978111
              INT=ca-app-pub-3940256099942544/1033173712
              REW=ca-app-pub-3940256099942544/5224354917
            else
              ORG=com.fofana
              APPID=ca-app-pub-6616009706842724~6109957163
              BAN=ca-app-pub-6616009706842724/2644610014
              INT=ca-app-pub-6616009706842724/1647967972
              REW=ca-app-pub-3940256099942544/5224354917
            fi
            flutter create --project-name agentshot --org $ORG app$V
            cp -r lib/. app$V/lib/
            sed -i 's/const useAds = false;/const useAds = true;/' app$V/lib/main.dart
            sed -i "s#ca-app-pub-3940256099942544/6300978111#$BAN#; s#ca-app-pub-3940256099942544/1033173712#$INT#; s#ca-app-pub-3940256099942544/5224354917#$REW#" app$V/lib/main.dart
            (cd app$V && flutter pub add google_mobile_ads audioplayers)
            M=app$V/android/app/src/main/AndroidManifest.xml
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' $M
            sed -i "0,/<activity/s//<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APPID\"\/>\n        <activity/" $M
            G=app$V/android/app/build.gradle.kts
            sed -i 's#signingConfig = signingConfigs.getByName("debug")#signingConfig = signingConfigs.getByName("debug")\n            isMinifyEnabled = false\n            isShrinkResources = false#' $G
            grep -n -B2 -A4 "isMinifyEnabled" $G || echo "GRADLE NON MODIFIE POUR $V"
          done
      - name: Compiler
        run: |
          for V in test prod; do
            (cd app$V && flutter build apk --release)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apk-test
          path: apptest/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-prod
          path: appprod/build/app/outputs/flutter-apk/app-release.apk
