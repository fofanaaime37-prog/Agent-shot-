name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Variante a (ancien module de pubs)
        continue-on-error: true
        run: |
          flutter create --project-name agent_shot_a --org com.monnom appa
          cp lib/main.dart appa/lib/main.dart
          sed -i 's/const useAds = false;/const useAds = true;/' appa/lib/main.dart
          cd appa
          flutter pub add google_mobile_ads:5.3.1
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' $M
          sed -i '0,/<activity/s//<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>\n        <activity/' $M
          flutter build apk --release --no-shrink
      - name: Variante b (dernier module de pubs)
        continue-on-error: true
        run: |
          flutter create --project-name agent_shot_b --org com.monnom appb
          cp lib/main.dart appb/lib/main.dart
          sed -i 's/const useAds = false;/const useAds = true;/' appb/lib/main.dart
          cd appb
          flutter pub add google_mobile_ads
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' $M
          sed -i '0,/<activity/s//<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>\n        <activity/' $M
          flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: variante-a-apk
          path: appa/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: variante-b-apk
          path: appb/build/app/outputs/flutter-apk/app-release.apk
