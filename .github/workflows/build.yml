name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Creer le projet et ajouter AdMob
        run: |
          flutter create --project-name agent_shot --org com.monnom app
          cp lib/main.dart app/lib/main.dart
          cd app
          flutter pub add google_mobile_ads
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' $M
          sed -i '0,/<activity/s//<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>\n        <activity/' $M
          sed -i '0,/<activity/s//<meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"\/>\n        <activity/' $M
          cat $M
      - name: Compiler le jeu
        run: |
          cd app
          flutter build apk --release
      - name: Compiler la petite appli de test
        run: |
          flutter create --project-name hello_test --org com.monnom hello
          cd hello
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          void main() => runApp(const MaterialApp(home: Scaffold(backgroundColor: Colors.blue, body: Center(child: Text('Ca marche', style: TextStyle(fontSize: 32, color: Colors.white))))));
          EOF
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: agent-shot-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hello-apk
          path: hello/build/app/outputs/flutter-apk/app-release.apk
